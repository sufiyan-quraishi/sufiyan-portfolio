    <!-- Avoid flash of incorrect theme: set before React mounts -->
    <script>
      (function () {
        var VALID = ['obsidian', 'violet', 'arctic', 'emerald', 'royal', 'mono'];
        try {
          var stored = localStorage.getItem('theme');
          var theme;
          if (stored && VALID.indexOf(stored) !== -1) {
            theme = stored;
          } else if (stored === 'light') {
            theme = 'arctic';
          } else if (stored === 'dark') {
            theme = 'obsidian';
          } else {
            theme = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'obsidian' : 'arctic';
          }
          document.documentElement.setAttribute('data-theme', theme);
        } catch (e) {
          document.documentElement.setAttribute('data-theme', 'obsidian');
        }
      })();
    </script>
